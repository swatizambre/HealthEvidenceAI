[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-evidence-ai"
version = "0.1.0"
description = "Healthcare evidence review with LangGraph agents, hybrid RAG, MCP, and grounded LLM providers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "mcp>=1.0.0",
  "numpy>=2.0.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "psycopg[binary]>=3.2.3",
  "PyJWT[crypto]>=2.9.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.14.1",
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.14.1",
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.1",
]
imaging = [
  "monai>=1.3.0",
]
realtime = [
  "redis>=5.0.0",
]

[project.scripts]
health-evidence = "app.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "evaluation*"]

[tool.uv]
default-groups = ["dev"]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = false
omit = []

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"app/api/routes/*.py" = ["B008"]

[tool.basedpyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["."]
# JSON API bodies are loosely shaped; use Any-friendly checking for tests/scripts.
typeCheckingMode = "standard"
reportMissingImports = true
reportUnusedImport = "warning"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportAny = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[[tool.basedpyright.executionEnvironments]]
root = "scripts"
extraPaths = ["."]
reportAny = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.mypy]
python_version = "3.12"
packages = ["app"]
exclude = ["tests", "scripts", "evaluation", "frontend"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
check_untyped_defs = true
