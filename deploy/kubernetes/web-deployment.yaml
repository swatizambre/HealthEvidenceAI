apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthevidence-web
  namespace: healthevidence
  labels:
    app: healthevidence-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthevidence-web
  template:
    metadata:
      labels:
        app: healthevidence-web
    spec:
      containers:
        - name: web
          image: healthevidence-web:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: healthevidence-web
  namespace: healthevidence
spec:
  selector:
    app: healthevidence-web
  ports:
    - name: http
      port: 80
      targetPort: http
