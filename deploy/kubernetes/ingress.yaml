apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthevidence
  namespace: healthevidence
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  rules:
    - host: healthevidence.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: healthevidence-api
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: healthevidence-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthevidence-web
                port:
                  number: 80
  tls:
    - hosts:
        - healthevidence.example.com
      secretName: healthevidence-tls
