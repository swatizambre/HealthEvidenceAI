apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthevidence-api
  namespace: healthevidence
  labels:
    app: healthevidence-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthevidence-api
  template:
    metadata:
      labels:
        app: healthevidence-api
    spec:
      containers:
        - name: api
          image: healthevidence-ai:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: healthevidence-config
            - secretRef:
                name: healthevidence-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: healthevidence-api
  namespace: healthevidence
spec:
  selector:
    app: healthevidence-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthevidence-api
  namespace: healthevidence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: healthevidence-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
