# Compose stack: PostgreSQL, Ollama, API, and frontend.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthevidence
      POSTGRES_PASSWORD: healthevidence
      POSTGRES_DB: healthevidence
    ports:
      - "5432:5432"
    volumes:
      - healthevidence_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthevidence -d healthevidence"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - healthevidence_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://healthevidence:healthevidence@postgres:5432/healthevidence
      LLM_PROVIDER: ollama
      MODEL_NAME: llama3.2
      OLLAMA_BASE_URL: http://ollama:11434
      SEED_ON_STARTUP: "true"
      ENVIRONMENT: docker
      LOG_LEVEL: INFO
      AUTH_MODE: dev-jwt
      OIDC_AUDIENCE: healthevidence-api
      OIDC_REQUIRED_ROLES: "patient,senior_clinician,resident,staff,admin,reviewer"
      IMAGING_BACKEND: monai
      A2A_ENABLED: "true"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      DEFAULT_LOCALE: en
      SUPPORTED_LOCALES: en,es,fr,de,pt,hi,ar,zh,ja
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  healthevidence_pg:
  healthevidence_ollama:
